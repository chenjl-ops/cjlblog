baseURL = 'https://blog.123go.club/'
locale = 'en-us'
title = 'CJL温馨小站'
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true

defaultContentLanguage = "zh-cn"
[languages]
[languages.zh-cn]
label = "中文"
weight = 1

[languages.zh-cn.params]
description = "技术文档中心"

[module]
[[module.imports]]
path = "github.com/imfing/hextra"

# Markdown 配置
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "github"
lineNos = true
lineNumbersInTable = true
noClasses = false

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [
  ["\\[", "\\]"],
  ["$$", "$$"]
]
inline = [
  ["\\(", "\\)"],
  ["$", "$"]
]


# Hextra 参数
[params]
description = "一个基于 Hugo + Hextra 的技术文档站"
dateFormat = "2006-01-02"

[params.comments]
enable = true
type = "giscus"

[params.comments.giscus]
repo = "chenjl-ops/blog-comments"
repoId = "R_kgDOToBYcQ"
category = "Announcements"
categoryId = "DIC_kwDOToBYcc4DCS28"
mapping = "pathname"
strict = false
reactionsEnabled = true
emitMetadata = false
inputPosition = "bottom"
theme = "preferred_color_scheme"
lang = "zh-CN"

[params.blog]
enable = true

[params.docs]
enable = true

[params.author]
name = "CJL"

# 深色模式
[params.theme]
default = "system"

# 数学公式
[params.math]
enable = true

# Mermaid
[params.mermaid]
enable = true


[params.homepage]
enableHero = true
showFeatures = true
showRecentPosts = true

[params.search]
enable = true

[params.navbar]
displayTitle = true
displayLogo = true

[params.navbar.search]
enable = true


[menu]

[[menu.main]]
name = "文档"
pageRef = "/docs"
weight = 1


[[menu.main]]
name = "博客"
pageRef = "/blog"
weight = 2


[[menu.main]]
name = "项目"
pageRef = "/projects"
weight = 3

[[menu.main]]
name = "搜索"
weight = 4
[menu.main.params]
type = "search"

[[menu.main]]
name = "GitHub"
weight = 5
url = "https://github.com/chenjl-ops"

[menu.main.params]
icon = "github"


[outputs]
home = [
"HTML",
"RSS"
]

